plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.example.selasar_pos"
    
    // UPDATE: Naikkan ke 36 agar sesuai dengan kebutuhan plugin terbaru (2026)
    compileSdk 36 
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.selasar_pos"
        
        // Gunakan minimal SDK 21 untuk stabilitas Supabase
        minSdkVersion flutter.minSdkVersion
        
        // UPDATE: Naikkan ke 36 agar tidak gagal saat checkReleaseAarMetadata
        targetSdk 36
        
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

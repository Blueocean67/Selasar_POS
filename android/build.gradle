buildscript {
    ext.kotlin_version = '2.1.0' 
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Set build directory untuk root project secara aman
rootProject.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir("../../build").get())

subprojects {
    // FIX SINTAKS: Set build directory untuk setiap subproject tanpa memicu kegagalan .get() awal
    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name))
    
    // UPDATE FIX: Paksa semua library pakai SDK 34/35/36 secara aman biar gak komplain AAR Metadata
    project.afterEvaluate {
        if (project.hasProperty('android')) {
            project.android {
                compileSdk = 36
                buildToolsVersion = "36.0.0"
            }
        }
    }
}

// FIX POSITION: evaluationDependsOn wajib ditaruh di luar block subprojects!
// Ini agar root project tahu bahwa evaluasi global membutuhkan persiapan modul utama aplikasi
rootProject.evaluationDependsOn(":app")

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}